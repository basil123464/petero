<section id="contacts">

    <h2>My Contacts</h2>

    <p><b>Phone:</b> <a href="tel:+254700275435">0700275435</a></p>

    <p>
        <b>Email:</b>
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=loumupeter@gmail.com" target="_blank">Send me an email</a>
    </p>

    <hr>

    <h3>Contact Form</h3>

    <form id="contactForm">

        <label for="name">Enter Your Name:</label><br>
        <input type="text" id="name" required>
        <br><br>

        <label for="email">E-mail Address:</label><br>
        <input type="email" id="email" required>
        <br><br>

        <label for="subject">Message Subject:</label><br>
        <input type="text" id="subject" required>
        <br><br>

        <label for="message">Enter Your Message:</label><br>
        <textarea id="message" rows="8" cols="35" required></textarea>
        <br><br>

        <input type="submit" value="Send">

    </form>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();

            var name    = document.getElementById("name").value;
            var email   = document.getElementById("email").value;
            var subject = document.getElementById("subject").value;
            var message = document.getElementById("message").value;

            var body = "Name: " + name + "\n" +
                       "Email: " + email + "\n\n" +
                       message;

            var gmailUrl = "https://mail.google.com/mail/?view=cm&fs=1" +
                           "&to=loumupeter@gmail.com" +
                           "&su=" + encodeURIComponent(subject) +
                           "&body=" + encodeURIComponent(body);

            // Open Gmail in a new tab; if the browser blocks it, open in the same tab
            var win = window.open(gmailUrl, "_blank");
            if (!win) {
                window.location.href = gmailUrl;
            }
        });
    </script>

</section>
